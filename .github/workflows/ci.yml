name: MLOps Security CI & Docker E2E

on:
  push:
    branches: [ main, audit, pickle-demo ]
  pull_request:
    branches: [ main, pickle-demo ]

jobs:
  testbed-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Prepare volume permissions for unprivileged execution
        run: |
          mkdir -p data_storage feature_store_storage artifacts reports keys
          chmod 755 data_storage feature_store_storage artifacts reports keys

      - name: Run Pytest Unit & Structural Integration Suite
        run: |
          pytest tests/ -v

      - name: Execute Scientific CVE-2026-96804 Reproduction Study
        run: |
          python experiments/cve_2026_96804_reproduction.py

      - name: Set up Node.js for Frontend Dashboard Verification
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend Demo Dashboard
        run: |
          cd demo
          npm ci || npm install
          npm run build

      - name: Execute Live Docker Compose End-to-End Verification
        run: |
          chmod +x scripts/verify_docker_e2e.sh
          ./scripts/verify_docker_e2e.sh

      - name: Upload Docker E2E Verification Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-e2e-verification-log
          path: reports/docker_e2e_verification.log
          if-no-files-found: ignore
