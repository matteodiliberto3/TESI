name: Full Scientific Reproducibility Benchmark

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Number of independent seeds for causal ablation study'
        required: false
        default: '30'

jobs:
  full-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Prepare volume permissions
        run: |
          mkdir -p data_storage feature_store_storage artifacts reports keys
          chmod 755 data_storage feature_store_storage artifacts reports keys

      - name: Provision ephemeral experiment signing keys
        run: |
          python pipeline/crypto_signer.py --generate-keys

      - name: Run Full Scientific Battery (Exp 1 to 6 + Causal Ablation)
        run: |
          chmod +x scripts/run_reproducibility_benchmark.sh
          ./scripts/run_reproducibility_benchmark.sh "${{ github.event.inputs.seeds || '30' }}"

      - name: Upload Complete Replicated Scientific Artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-replicated-scientific-reports
          path: |
            reports/causal_ablation_results.json
            reports/CAUSAL_ABLATION_REPORT.md
            reports/EXPERIMENT_RESULTS.md
            reports/evasion_results.json
            reports/system_benchmarks.json
            reports/system_benchmarks.csv
            reports/exp2_matched_results.json
            reports/parametric_sweep_results.json
            reports/parametric_sweep_results.csv
            reports/*.png
            reports/*.log
            reports/CAPITOLO_5_COMPLETO.md
          if-no-files-found: warn
