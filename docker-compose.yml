version: '3.8'

services:
  # =========================================================================
  # 1. Producer Domain: CI/CD Build & Model Training Pipeline
  # Authorized signing entity possessing private RSA key (SLSA Level 3).
  # Provisions RSA keypair if missing on clean clone, trains, and signs artifact.
  # =========================================================================
  mlops-training-producer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops_training_producer
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data_storage:/app/data_storage
      - ./feature_store_storage:/app/feature_store_storage
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
      - ./keys:/app/keys
    environment:
      - PYTHONUNBUFFERED=1
      - MLOPS_ROLE=PRODUCER
    command: >
      sh -c "python pipeline/crypto_signer.py --generate-keys &&
             python pipeline/train.py"

  # =========================================================================
  # 2. Consumer Domain: Persistent Unprivileged Production Inference Worker
  # Strictly segregated: mounts ONLY public key in read-only mode (:ro).
  # Starts ONLY after producer completes successfully; serves HTTP predictions.
  # =========================================================================
  mlops-inference-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops_inference_consumer
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./feature_store_storage:/app/feature_store_storage:ro
      - ./keys/public_key.pem:/app/keys/public_key.pem:ro
    environment:
      - PYTHONUNBUFFERED=1
      - MLOPS_ROLE=CONSUMER
      - INFERENCE_MODE=signed_pickle
      - PORT=8000
    command: python pipeline/serve.py
    depends_on:
      mlops-training-producer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

  # =========================================================================
  # 3. Master Testbed Runner: Battery of Empirical Security Experiments
  # Kept in a dedicated profile to prevent concurrent volume write collisions.
  # Usage: docker compose --profile experiments run --rm mlops-security-testbed
  # =========================================================================
  mlops-security-testbed:
    profiles:
      - experiments
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops_security_experiment
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data_storage:/app/data_storage
      - ./feature_store_storage:/app/feature_store_storage
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
      - ./keys:/app/keys
    environment:
      - PYTHONUNBUFFERED=1
    command: python experiments/run_all_experiments.py
