services:
  # =========================================================================
  # 1. Producer Domain: CI/CD Build & Model Training Pipeline
  # Authorized signing entity possessing private RSA key (SLSA Level 3).
  # Provisions RSA keypair, trains model, and signs artifact with RSA-PSS.
  # =========================================================================
  mlops-training-producer:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    container_name: mlops_training_producer
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data_storage:/app/data_storage
      - ./feature_store_storage:/app/feature_store_storage
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
      - ./keys:/app/keys
    environment:
      - PYTHONUNBUFFERED=1
      - MLOPS_ROLE=PRODUCER
      - PYTHONPATH=/app
    command: >
      sh -c "python pipeline/crypto_signer.py --generate-keys &&
             python pipeline/train.py"

  # =========================================================================
  # 2. Model Registry & Object Storage (MinIO S3-Compatible Storage)
  # Centralized artifact repository holding model candidates and signatures.
  # Untrusted staging domain subject to potential supply chain tampering.
  # =========================================================================
  mlops-minio-storage:
    image: minio/minio:latest
    container_name: mlops_minio_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=mlops_admin
      - MINIO_ROOT_PASSWORD=mlops_secure_password_2026
    volumes:
      - ./data_storage/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =========================================================================
  # 3. Security Gate / Policy Admission Controller
  # Validates RSA-PSS cryptographic signatures and structural constraints
  # in-memory BEFORE allowing unpickling in the consumer runtime.
  # =========================================================================
  mlops-security-gate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops_security_gate
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./keys/public_key.pem:/app/keys/public_key.pem:ro
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    command: >
      sh -c "python -c 'from pipeline.crypto_signer import ModelConsumerVerifier; import config; v = ModelConsumerVerifier(config.PUBLIC_KEY_FILE); v.load_verified_pickle(config.CLEAN_MODEL_PICKLE, config.SIGNATURE_FILE); print(\"[Gate] Gate admission check passed: clean model verified.\")'"
    depends_on:
      mlops-training-producer:
        condition: service_completed_successfully

  # =========================================================================
  # 4. Consumer Domain: Persistent Unprivileged FastAPI Inference Worker
  # Strictly segregated: mounts ONLY public key in read-only mode (:ro).
  # High risk runtime unprivileged: cap_drop: [ALL], no-new-privileges: true.
  # =========================================================================
  mlops-inference-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    container_name: mlops_inference_consumer
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./feature_store_storage:/app/feature_store_storage:ro
      - ./keys/public_key.pem:/app/keys/public_key.pem:ro
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
      - MLOPS_ROLE=CONSUMER
      - INFERENCE_MODE=signed_pickle
      - PORT=8000
      - PYTHONPATH=/app
    command: python pipeline/serve.py --mode signed_pickle --port 8000
    depends_on:
      mlops-training-producer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

  # =========================================================================
  # 5. Master Testbed Runner: Empirical T0 - T5 Battery
  # Usage: docker compose --profile experiments run --rm mlops-security-testbed
  # =========================================================================
  mlops-security-testbed:
    profiles:
      - experiments
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops_security_experiment
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data_storage:/app/data_storage
      - ./feature_store_storage:/app/feature_store_storage
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
      - ./keys:/app/keys
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    command: python experiments/run_t0_t5_suite.py
